<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteZero Map - Debug</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: monospace; padding: 20px; }
        #map { height: 500px; width: 100%; margin-bottom: 20px; }
        .debug { background: #f0f0f0; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>🦟 BiteZero Map - Debug Mode</h1>
    <div id="map"></div>
    <div class="debug" id="debug">
        Loading sheet data...
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SHEET_ID = "1hlc17MiNRhBIocOZ5asWmdSoeMa5zITL_Q6DXK2lZyM";
        const debugDiv = document.getElementById('debug');
        
        let map;
        
        function log(message, isError = false) {
            const p = document.createElement('div');
            p.innerHTML = isError ? `❌ ${message}` : `✅ ${message}`;
            p.style.color = isError ? 'red' : 'green';
            debugDiv.appendChild(p);
            console.log(message);
        }
        
        async function debugSheet() {
            try {
                log("Fetching sheet data...");
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
                const response = await fetch(url);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const text = await response.text();
                const jsonText = text.substring(47).slice(0, -2);
                const data = JSON.parse(jsonText);
                
                const table = data.table;
                const cols = table.cols;
                const rows = table.rows;
                
                log(`Found ${cols.length} columns and ${rows.length} rows of data`);
                
                // Show all column headers
                log("--- COLUMN HEADERS IN YOUR SHEET ---");
                const headers = [];
                for (let i = 0; i < cols.length; i++) {
                    const label = cols[i].label;
                    headers.push(label);
                    log(`Column ${i}: "${label}"`);
                }
                
                // Check for GPS columns
                const latCol = headers.findIndex(h => 
                    h && (h.toLowerCase().includes('lat') || h === 'GPS_Latitude' || h === 'Latitude'));
                const lngCol = headers.findIndex(h => 
                    h && (h.toLowerCase().includes('lng') || h.toLowerCase().includes('lon') || h === 'GPS_Longitude' || h === 'Longitude'));
                const riskCol = headers.findIndex(h => 
                    h && (h.toLowerCase().includes('risk') || h === 'Risk_Tier'));
                
                log(`--- COLUMN DETECTION ---`);
                log(`Latitude column index: ${latCol} (${latCol !== -1 ? headers[latCol] : 'not found'})`);
                log(`Longitude column index: ${lngCol} (${lngCol !== -1 ? headers[lngCol] : 'not found'})`);
                log(`Risk column index: ${riskCol} (${riskCol !== -1 ? headers[riskCol] : 'not found'})`);
                
                // Show first row of data
                if (rows.length > 0 && rows[0].c) {
                    log(`--- FIRST ROW OF DATA (raw values) ---`);
                    for (let i = 0; i < Math.min(rows[0].c.length, 10); i++) {
                        const val = rows[0].c[i] ? rows[0].c[i].v : '(empty)';
                        log(`Row 0, Col ${i} (${headers[i] || 'no header'}): ${val}`);
                    }
                }
                
                // Count valid GPS rows
                let validGps = 0;
                for (let i = 0; i < rows.length; i++) {
                    const cells = rows[i].c;
                    if (!cells) continue;
                    if (latCol !== -1 && lngCol !== -1) {
                        const lat = cells[latCol] ? parseFloat(cells[latCol].v) : null;
                        const lng = cells[lngCol] ? parseFloat(cells[lngCol].v) : null;
                        if (lat && lng && !isNaN(lat) && !isNaN(lng) && lat !== 0) {
                            validGps++;
                        }
                    }
                }
                log(`Found ${validGps} rows with valid GPS coordinates`);
                
                if (validGps === 0) {
                    log("No GPS coordinates found! Check your column names above.", true);
                }
                
                // Initialize map and show pins
                initMapWithData(rows, headers, latCol, lngCol, riskCol);
                
            } catch (error) {
                log(`Error: ${error.message}`, true);
            }
        }
        
        function initMapWithData(rows, headers, latCol, lngCol, riskCol) {
            map = L.map('map').setView([14.5995, 120.9842], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            const markers = [];
            
            for (let i = 0; i < rows.length; i++) {
                const cells = rows[i].c;
                if (!cells) continue;
                
                if (latCol !== -1 && lngCol !== -1) {
                    const lat = cells[latCol] ? parseFloat(cells[latCol].v) : null;
                    const lng = cells[lngCol] ? parseFloat(cells[lngCol].v) : null;
                    
                    if (lat && lng && !isNaN(lat) && !isNaN(lng) && lat !== 0) {
                        let risk = "🟡 MEDIUM RISK";
                        if (riskCol !== -1 && cells[riskCol]) {
                            risk = cells[riskCol].v;
                        }
                        
                        const color = risk.includes("🔴") ? "#e74c3c" : (risk.includes("🟡") ? "#f1c40f" : "#27ae60");
                        
                        const marker = L.circleMarker([lat, lng], {
                            radius: 10,
                            fillColor: color,
                            color: "white",
                            weight: 2,
                            fillOpacity: 0.8
                        }).addTo(map);
                        
                        marker.bindPopup(`<b>${risk}</b><br>Lat: ${lat}<br>Lng: ${lng}`);
                        markers.push(marker);
                    }
                }
            }
            
            if (markers.length > 0) {
                const group = L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
                log(`✅ Added ${markers.length} pins to the map`);
            } else {
                log("⚠️ No pins added to the map", true);
            }
        }
        
        debugSheet();
    </script>
</body>
</html>
